# ================= AI Motor Claim Assessor =================
server.port=8080
spring.application.name=ai-motor-claim-assessor

# MongoDB: chay local (mongod) hoac Atlas.
# Dat bien moi truong MONGODB_URI de ghi de, VD:
# MONGODB_URI=mongodb+srv://<user>:<pass>@<cluster>/aimotor_claim
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/aimotor_claim}

# Upload: toi da 10MB/anh, 100MB/yeu cau
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# ================= Gemini =================
# Lay API key tai https://aistudio.google.com/apikey
# Cach 1 (khuyen dung): dat bien moi truong GEMINI_API_KEY truoc khi chay.
# Cach 2: dien truc tiep o day (KHONG commit key that len git).
# Cach 3: nhap qua giao dien Cai dat (luu vao MongoDB, uu tien cao nhat).
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.8-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models

# ================= Luu tru anh =================
app.storage.reference-dir=./storage/reference-damages
app.storage.vehicle-dir=./storage/vehicles
app.storage.claim-dir=./storage/claims
# Nhat ky xac minh danh tinh (SQLite cuc bo, bao mat, khong commit len git)
app.storage.verification-db=./storage/verification-audit.db

# Tien xu ly anh gui AI: rong toi da 1024px, chat luong JPG 85%
app.image.max-width=1024
app.image.jpeg-quality=0.85
# Nguong do net (phuong sai Laplacian): duoi nguong nay anh bi coi la mo
app.image.sharpness-threshold=80.0
# So anh toi thieu cho 1 ho so tham dinh
app.assessment.min-photos=2

logging.level.com.aimotor.claim=INFO
